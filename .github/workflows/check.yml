name: check

# Manual only. bin/test-ci.sh on the ref you name, or the branch you dispatched.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to test. Empty uses the branch you dispatched.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: bin/test-ci.sh
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
      - name: bin/test-ci.sh
        run: bash bin/test-ci.sh
