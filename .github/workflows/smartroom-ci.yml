name: SmartRoom checks

# The fork's shipped branches (smartroom/main stable, smartroom/edge edge) and
# their fix branches run the suites they carry: every package's test/all and
# smartroom/test/all, in the pinned Arch container upstream's tests.yml uses.
# No secrets: read-only checkouts of public repositories only.

on:
  push:
    branches: [smartroom/main, smartroom/edge, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  suites:
    name: Package and SmartRoom recipe suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ARCH_IMAGE: archlinux:base-devel@sha256:8745817f349ed24373341ddb92776209eeec3f0364ea48f7f645ac5800d30a50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: omarchy-mac-pkgs
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned runtime
        id: runtime
        run: |
          read -r repository commit < <(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' omarchy-mac-pkgs/test/integration/runtime)
          echo "repository=$repository" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.runtime.outputs.repository }}
          ref: ${{ steps.runtime.outputs.commit }}
          path: runtime
          persist-credentials: false
      # smartroom-omarchy-helpers holds copies of the runtime at its own SOURCE tag.
      - name: Read the helpers' runtime
        id: helpers
        run: echo "commit=$(sed -n 's/^commit=//p' omarchy-mac-pkgs/smartroom-omarchy-helpers/SOURCE)" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: omacom/omarchy
          ref: ${{ steps.helpers.outputs.commit }}
          path: runtime-helpers
          persist-credentials: false
      - name: Start the Arch container
        run: |
          docker run -d --init --name arch -v "$GITHUB_WORKSPACE:/work" -w /work/omarchy-mac-pkgs "$ARCH_IMAGE" sleep infinity
          docker exec arch pacman -Syu --noconfirm --needed \
            git jq lua python python-yaml nodejs npm ripgrep shellcheck imagemagick ffmpeg kitty \
            gum plocate openssh unzip bc libarchive libxkbcommon desktop-file-utils glib2 sqlite dtc
          docker exec arch bash -c 'echo "en_US.UTF-8 UTF-8" >/etc/locale.gen && locale-gen'
          docker exec arch useradd --create-home --uid "$(id -u)" tester
      - name: Package suites
        run: |
          status=0
          for package in omarchy-mac-pkgs/*/; do
            package=$(basename "$package")
            [[ -x omarchy-mac-pkgs/$package/install && -x omarchy-mac-pkgs/$package/test/all ]] || continue
            runtime=/work/runtime
            [[ $package != smartroom-omarchy-helpers ]] || runtime=/work/runtime-helpers
            echo "::group::$package"
            docker exec -u tester -e HOME=/home/tester -e OMARCHY_TEST_RUNTIME="$runtime" arch "$package/test/all" ||
              { status=1; echo "::error::$package suite failed"; }
            echo "::endgroup::"
          done
          exit "$status"
      - name: smartroom/test/all
        run: docker exec -u tester -e HOME=/home/tester arch bash smartroom/test/all
